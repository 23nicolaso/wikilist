<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#edf2f5">
  <meta name="description" content="A daily map of connections. Place stronger connections nearer.">
  <title>Nearer</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #edf2f5; color: #202b38; font-family: Helvetica, Arial, sans-serif; }
    #game { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
    #loading strong { font-size: 27px; letter-spacing: -1px; }
    #track { margin-top: 22px; width: 92px; height: 2px; background: #c6d1da; }
    #progress { width: 0; height: 100%; background: #345cda; transition: width 180ms; }
    #message { max-width: 340px; text-align: center; font-size: 13px; line-height: 1.6; padding: 0 24px; }
    #keyboard-help { position: absolute; left: -10000px; top: 0; }
    @media (prefers-reduced-motion: reduce) { #progress { transition: none; } }
  </style>
</head>
<body>
  <p id="keyboard-help">Nearer. Select a topic with Tab. Arrow keys move it. Enter places it. Stronger connections belong closer to the center.</p>
  <canvas id="game" tabindex="0" aria-label="Nearer connection map" aria-describedby="keyboard-help"></canvas>
  <div id="loading" role="status" aria-live="polite"><strong>nearer</strong><div id="track"><div id="progress"></div></div><p id="message"></p></div>
  <script>
    const canvas = document.getElementById('game');
    const loading = document.getElementById('loading');
    const message = document.getElementById('message');
    const build = 'Build';
    const config = {
      dataUrl: build + '/{{{ DATA_FILENAME }}}',
      frameworkUrl: build + '/{{{ FRAMEWORK_FILENAME }}}',
      codeUrl: build + '/{{{ CODE_FILENAME }}}',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Nearer', productName: 'Nearer', productVersion: '1.0',
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      matchWebGLToCanvasSize: true,
      showBanner: function(text, type) { if (type === 'error') message.textContent = 'The map could not open. Refresh to try again.'; }
    };
    window.nearerPixelRatio = config.devicePixelRatio;
    const loader = document.createElement('script');
    loader.src = build + '/{{{ LOADER_FILENAME }}}';
    loader.onload = function() {
      createUnityInstance(canvas, config, function(progress) { document.getElementById('progress').style.width = Math.round(progress * 100) + '%'; }).then(function(instance) {
        window.nearerInstance = instance;
        loading.hidden = true;
        loading.style.display = 'none';
        canvas.focus();
      }).catch(function() { message.textContent = 'The map could not open. Refresh to try again.'; });
    };
    loader.onerror = function() { message.textContent = 'The map could not load. Refresh to try again.'; };
    document.body.appendChild(loader);
  </script>
</body>
</html>
